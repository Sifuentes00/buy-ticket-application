version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_URL: https://cinemapro.shop
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/cinema-app/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: https://cinemapro.shop,http://localhost:5173,http://localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_URL}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ISSUER: https://cinemapro.shop/realms/cinema-app
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_URL}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    command: start-dev --import-realm --proxy=edge
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: "edge"
      KC_HOSTNAME_PORT: "443"
      KC_HOSTNAME_URL: "https://cinemapro.shop"
      KC_HOSTNAME_ADMIN_URL: "https://cinemapro.shop"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:z

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://cinemapro.shop/api}
        - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL:-https://cinemapro.shop}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./my-spring-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://cinemapro.shop/api}
      - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL:-https://cinemapro.shop}

volumes:
  db_data:
  keycloak_data:
