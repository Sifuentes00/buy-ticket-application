server {
    listen 80;
    server_name localhost 127.0.0.1;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html index.htm;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name cinemapro.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
     listen 443 ssl;
     server_name cinemapro.shop;

     ssl_certificate /etc/letsencrypt/live/cinemapro.shop/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/cinemapro.shop/privkey.pem;

     location / {
         root /usr/share/nginx/html;
         try_files $uri $uri/ /index.html;
     }

     location /api/ {
         proxy_pass http://app:8080;
	 proxy_set_header Host $host;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

         proxy_set_header Authorization $http_authorization;
         proxy_pass_header Authorization;
     }

     location /realms/ {
        proxy_pass http://keycloak:8080/realms/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /admin/ {
        proxy_pass http://keycloak:8080/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
   }

    location /resources/ {
        proxy_pass http://keycloak:8080/resources/;
    }
}

